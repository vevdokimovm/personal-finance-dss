[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers -m "not e2e and not full and not deep"
markers =
    e2e: браузерные end-to-end тесты (требуют Playwright + браузер). Запуск: pytest -m e2e
    core: тесты МАТЕМАТИЧЕСКОГО ЯДРА — третья сущность продукта наряду с фронтом
        и бэкендом (решение владельца 06.09.2026). Отличие по цене ошибки: бэкенд
        ломается в 500, фронт — в пустой экран, ЯДРО — в неверный совет о деньгах,
        которому человек поверит. Свой порог покрытия — 95 % (`.coveragerc.core`),
        своя джоба CI. Запуск: pytest -m core
    property: property-based инварианты ядра (hypothesis). Запуск: pytest -m property
    fast: быстрый прогон (unit + integration + property + e2e-smoke) — каждый push. Авто-маркер.
    full: предрелизный прогон (визуальная регрессия, live-a11y) — перед тегом. Запуск: pytest -m full
    deep: глубокий прогон (стресс-property, мутации) — редко/вручную. Запуск: pytest -m deep
    slow: тяжёлые слоистые тесты генераторов (строят наборы по 12 000). В CI и полном
        прогоне идут как обычно; в интерактивной песочнице исключаются во избежание
        попадания на паузу контейнера: pytest -m "not slow" (см.
        docs/reports/investigations/sandbox_full_suite_investigation.md).
