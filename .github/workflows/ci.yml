name: CI

# Три категории тестов (см. docs/testing_infrastructure.md):
#   fast  — каждый push/PR: unit + integration + property + e2e-smoke (chromium), гейт 90%.
#   full  — на тегах vX.Y.Z и вручную: мультибраузер E2E + визуальная регрессия + live-a11y + security.
#   deep  — вручную и еженедельно: стресс-property (тысячи примеров) + мутационное тестирование.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # понедельник 03:00 UTC — глубокий прогон
  workflow_dispatch:       # ручной запуск full/deep

jobs:
  # ── (0) PREFLIGHT — БЛОКИРУЮЩИЙ и самый дешёвый гейт. ──
  # Контрмера уровня 3 из docs/reports/recurrence_ledger.md: правила, которые
  # трижды не сработали в виде текста, проверяются кодом. Стоит секунды и
  # ловит ceremony-дрейф до того, как запустится всё остальное.
  preflight:
    name: Preflight (церемония и грабли)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Предполётная проверка
        run: python -m tools.preflight

  # ── (1) БЫСТРЫЙ — БЛОКИРУЮЩИЙ гейт. Матрица SQLite + PostgreSQL, покрытие ≥ 90%. ──
  # ── (0а) ЯДРО — ТРЕТЬЯ СУЩНОСТЬ, отдельная джоба и отдельный порог ──────────
  # Решение владельца 06.09.2026: «есть тесты бэк, фронт — может сделать и тесты
  # ядра математического? как будто это три сущности разные».
  #
  # 🔴 Отличие не организационное, а по ЦЕНЕ ОШИБКИ:
  #   бэкенд сломался → 500, человек видит отказ и повторит;
  #   фронт сломался  → пустой экран, человек пожалуется;
  #   ЯДРО сломалось  → неверный совет о деньгах, и человек ему поверит.
  # Третий случай не даёт ни отказа, ни жалобы — продукт работает, числа выглядят
  # правдоподобно, а человек гасит не тот долг.
  #
  # Отсюда порог 95 % против общих 90 % (`.coveragerc.core`): непокрытая ветка
  # в роутере означает необработанный запрос, непокрытая ветка в ядре — расчётный
  # путь, по которому никто не проходил, и он выдаст число, которое некому оспорить.
  #
  # Джоба отдельная, чтобы красное ядро было ВИДНО: в общем прогоне из 1742 тестов
  # падение одного теста модели теряется среди прочих.
  core:
    name: Ядро модели (порог 95%)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # 🔴 Сборка фронта ДО pytest — ровно как в джобе «Быстрый». Без неё сервер отдаёт
      # 404 на адресах SPA, и 16 проверок (`test_api_pages`, `test_legal_pages`,
      # `test_guest_mode`) краснели здесь, будучи зелёными везде. Теперь они либо
      # исполняются по-настоящему, либо пропускаются с названной причиной
      # (`tests/support/workstation.py`), но не врут красным.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Сборка фронта (адреса SPA обязаны отвечать приложением)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # Прогон ВСЕХ тестов, покрытие считается только по `app/core` (`source` в конфиге).
      # Ограничить прогон маркером `core` нельзя: ядро вызывается и из тестов API,
      # и эти пути — тоже его покрытие.
      - name: Тесты + покрытие ядра
        run: |
          coverage run --rcfile=.coveragerc.core -m pytest -m fast -rs
          coverage report --rcfile=.coveragerc.core

  fast:
    name: Быстрый (${{ matrix.db }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finpilot
          POSTGRES_PASSWORD: finpilot
          POSTGRES_DB: finpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpilot -d finpilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: ${{ matrix.db == 'postgresql' && 'postgresql+psycopg://finpilot:finpilot@localhost:5432/finpilot_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Revision gate (docs↔code, статически, быстро)
        run: python -m tools.revision.revision_check
      # 🔴 Сборка фронта ДО pytest. Гейт `test_spa_is_actually_served.py` проверяет, что
      # сервер отдаёт React, а не Jinja, и пропускает себя, если `frontend/dist` нет.
      # Без этого шага он молча не исполнялся бы — тот самый класс, ради которого он
      # и заведён: проверка есть, вердикт «зелено» означает «не проверялось» (PIT-020).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Сборка фронта (нужна гейту «сервер отдаёт SPA»)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Быстрые тесты + покрытие (unit + integration + property, порог 90%)
        run: |
          coverage run -m pytest -m fast -rs
          coverage report
      - name: E2E-smoke (chromium)
        run: |
          # 🔴 Раннер несёт apt-репозиторий Microsoft, который 24.09.2026 начал отдавать
          # 403 Forbidden («The repository ... is no longer signed»). `--with-deps` зовёт
          # `apt-get update`, тот выходит ненулевым — и установка браузеров падает с кодом 100,
          # унося джобу целиком. К нашему коду отношения не имеет; снимаем чужой источник
          # перед установкой. Список и ключ удаляются оба: без ключа apt ругается снова.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/trusted.gpg.d/microsoft.gpg || true
          playwright install --with-deps chromium
          pytest -m e2e --browser chromium

  # ── (1а) ФРОНТ — БЛОКИРУЮЩИЙ гейт. Веха 8, docs/frontend_milestone8_plan.md Шаг 5. ──
  # typecheck + lint + vitest + build — в fast-тир, как и бэк (docs/frontend_migration_plan.md §4).
  frontend:
    name: Фронт (typecheck + lint + vitest + build)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установка зависимостей
        run: npm ci
      - name: Генерация типизированного клиента (контроль дрейфа от openapi.json)
        run: npm run generate:client
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Формат (Prettier)
        run: npm run format:check
      # 🔴 Покрытие, а не голый прогон — симметрично бэкенду (решение владельца
      # 06.09.2026). Джоба фронта гоняла `npm test` без порога, тогда как бэкенд
      # шёл через `coverage report` с `fail_under = 90`: одна половина продукта
      # держала планку, вторая не измерялась вовсе, и разницу не было видно ниоткуда.
      # Порог фронта живёт в `frontend/vite.config.ts` (`test.coverage.thresholds`),
      # порог бэкенда — в `.coveragerc`; оба равны 90.
      - name: Vitest + покрытие (порог 90%)
        run: npm run test:coverage
      - name: Сборка
        run: npm run build

  # ── Линтеры: flake8 и mypy БЛОКИРУЮТ, pylint информационный. ────────────────
  #
  # 🔴 До v8.50.0 вся джоба стояла с `continue-on-error: true`, то есть красное
  # в ней не значило ничего — «декоративность джобы линтеров» висела отдельным
  # пунктом долга в роадмапе. Разделено по факту, а не по желанию: flake8 и mypy
  # на момент правки чисты (`mypy app` — 118 файлов без ошибок) и уже входят
  # в блокирующий `tools.preflight`, то есть де-факто обязательны — сделать их
  # блокирующими здесь ничего не ломает и убирает расхождение между локальным
  # гейтом и CI.
  #
  # pylint остаётся информационным ЧЕСТНО: 9.63/10 с замечаниями `duplicate-code`
  # в расчётных модулях. Сделать его блокирующим сейчас значило бы либо покрасить
  # CI в красное, либо занизить порог до бессмысленного — оба варианта хуже
  # честной пометки «информационно».
  lint:
    name: Линтеры (flake8, mypy — блокируют)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: flake8
        run: flake8 .
      - name: mypy
        run: mypy app --config-file=.mypy.ini

  # ── pylint: ХРАПОВИК по оценке, а не «информационно». ──────────────────────
  # 🔴 Изменено 24.09.2026 по требованию владельца «зелёный гейт в CI целиком».
  # Прежняя схема (`continue-on-error: true`) давала вечный красный крестик в списке
  # проверок при зелёном прогоне: формально не блокирует, фактически — постоянный шум,
  # на фоне которого настоящее красное неотличимо от привычного. Это тот же класс,
  # что молчаливый пропуск: индикатор, который всегда в одном положении, не индикатор.
  #
  # Теперь джоба — настоящий гейт с порогом: `--fail-under` держит достигнутую оценку
  # и падает при регрессе. Порог **только растёт**: улучшили код — подняли число здесь
  # тем же батчем. Оценка на 24.09.2026 — 9.61/10 (231 замечание, крупнейшие классы:
  # R0913/R0914 слишком много аргументов и локальных, C0415 импорт не наверху,
  # R0801 дублирование). Довести до 10/10 — отдельная задача, она не отменяется
  # этим порогом, а получает защиту от отката.
  pylint:
    name: pylint (храповик оценки)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # Порог держит достигнутое и падает при регрессе; список замечаний остаётся в логе.
      - name: pylint (порог 9.6 — только вверх)
        run: pylint app --rcfile=.pylintrc --fail-under=9.6

  # ── (2) ПОЛНЫЙ — на тегах vX.Y.Z и вручную. Здесь CDN Playwright доступен, ──
  #    поэтому реально гоняются firefox и webkit (в песочнице CDN заблокирован).
  full:
    name: Полный (мультибраузер + визуал + a11y + security)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SECRET_KEY: test-secret-key-for-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pillow
      - name: Установка браузеров (chromium + firefox + webkit)
        run: |
          # 🔴 Раннер несёт apt-репозиторий Microsoft, который 24.09.2026 начал отдавать
          # 403 Forbidden («The repository ... is no longer signed»). `--with-deps` зовёт
          # `apt-get update`, тот выходит ненулевым — и установка браузеров падает с кодом 100,
          # унося джобу целиком. К нашему коду отношения не имеет; снимаем чужой источник
          # перед установкой. Список и ключ удаляются оба: без ключа apt ругается снова.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/trusted.gpg.d/microsoft.gpg || true
          playwright install --with-deps chromium firefox webkit
      # 🔴 Node и сборка фронта — ДО pytest, а не после (исправлено v9.1.0).
      # Здесь они стояли ниже E2E, поэтому `frontend/dist` не существовал, сервер
      # `tests/e2e/conftest.py` отдавал 404 на `/`, не проходил проверку готовности —
      # и весь тир падал с `E2E live server failed to start` без единой строки
      # о причине. В джобе `fast` сборка стоит перед pytest ровно по этой причине,
      # и там же записано почему; сюда правило не доехало (§7 автономного стандарта:
      # правило, дошедшее не всюду, — это расхождение).
      - name: Фронт — установка Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Фронт — зависимости
        working-directory: frontend
        run: npm ci
      - name: Фронт — сборка (нужна E2E — сервер отдаёт SPA, а не 404)
        working-directory: frontend
        run: npm run build
      - name: Мультибраузерные E2E (chromium + firefox + webkit)
        run: pytest -m e2e --browser chromium --browser firefox --browser webkit
      - name: Полный тир (визуальная регрессия + live-a11y)
        run: pytest -m full --browser chromium
      - name: Фронт — браузеры Playwright (мультибраузер, как и бэк-E2E)
        working-directory: frontend
        run: |
          # 🔴 Раннер несёт apt-репозиторий Microsoft, который 24.09.2026 начал отдавать
          # 403 Forbidden («The repository ... is no longer signed»). `--with-deps` зовёт
          # `apt-get update`, тот выходит ненулевым — и установка браузеров падает с кодом 100,
          # унося джобу целиком. К нашему коду отношения не имеет; снимаем чужой источник
          # перед установкой. Список и ключ удаляются оба: без ключа apt ругается снова.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/trusted.gpg.d/microsoft.gpg || true
          npx playwright install --with-deps chromium firefox webkit
      - name: Фронт — E2E
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium --project=firefox --project=webkit
      - name: Security — статанализ кода (bandit)
        run: |
          pip install -q bandit
          bandit -q -r app -ll
      - name: Security — аудит зависимостей (pip-audit)
        run: |
          pip install -q pip-audit
          pip-audit -r requirements.txt
      - name: Нагрузка — smoke locust (headless, коротко)
        run: |
          pip install -q locust
          SECRET_KEY=x uvicorn app.main:app --port 8000 &
          sleep 5
          locust -f loadtest/locustfile.py --headless -u 20 -r 5 -t 30s --host http://127.0.0.1:8000

  # ── (3) ГЛУБОКИЙ — вручную и еженедельно. Стресс-property + мутации. ─────────
  deep:
    name: Глубокий (стресс-property + мутации)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SECRET_KEY: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Стресс-property (тысячи примеров)
        run: pytest -m deep
      - name: Мутационное тестирование ядра (mutmut)
        run: |
          pip install -q mutmut
          mutmut run --paths-to-mutate app/core || true
          mutmut results || true
